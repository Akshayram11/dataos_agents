type: policy
name: customer_profile_access
depends_on:
  - silverv1.dim_customer_profile

rules:
  - group: product_sandbox_tenant_admin
  - group: retail_admin
  - group: retail_north_analyst
    mask:
      - EMAIL
      - CUSTOMER_NAME

    filter:
      - member: REGION_NAME
        operator: equals
        values:
          - North
  - group: retail_south_analyst
    mask:
      - EMAIL
      - CUSTOMER_NAME

    filter:
      - member: REGION_NAME
        operator: equals
        values:
          - South
  - group: retail_east_analyst
    mask:
      - EMAIL
      - CUSTOMER_NAME

    filter:
      - member: REGION_NAME
        operator: equals
        values:
          - East
  - group: retail_west_analyst
    mask:
      - EMAIL
      - CUSTOMER_NAME

    filter:
      - member: REGION_NAME
        operator: equals
        values:
          - West
  - group: retail_central_analyst
    mask:
      - EMAIL
      - CUSTOMER_NAME

    filter:
      - member: REGION_NAME
        operator: equals
        values:
          - Central
