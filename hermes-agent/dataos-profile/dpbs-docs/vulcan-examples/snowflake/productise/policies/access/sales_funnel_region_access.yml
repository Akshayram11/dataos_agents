type: policy
name: sales_funnel_region_access
depends_on:
  - goldv1.sales_funnel_analysis

rules:
  - group: product_sandbox_tenant_admin
  - group: retail_admin
  - group: retail_north_analyst
    filter:
      - member: REGION_NAME
        operator: equals
        values:
          - North
  - group: retail_south_analyst
    filter:
      - member: REGION_NAME
        operator: equals
        values:
          - South
  - group: retail_east_analyst
    filter:
      - member: REGION_NAME
        operator: equals
        values:
          - East
  - group: retail_west_analyst
    filter:
      - member: REGION_NAME
        operator: equals
        values:
          - West
  - group: retail_central_analyst
    filter:
      - member: REGION_NAME
        operator: equals
        values:
          - Central
