kind: dq
name: dim_customer_profile_dq
depends_on: silverv1.dim_customer_profile
expectations:
- expectation: expect_table_row_count_to_be_between
  min_value: 10
  max_value: null
  meta:
    dimension: completeness
    name: minimum_customer_profiles
    description: Customer profile should include the seed customer population
- expectation: expect_column_values_to_not_be_null
  column: CUSTOMER_ID
  meta:
    dimension: completeness
    name: no_missing_customer_id
    description: Customer id is required
- expectation: expect_column_values_to_be_unique
  meta:
    dimension: uniqueness
    name: unique_customer_profiles
    description: One profile row per customer
  column: CUSTOMER_ID
- expectation: expect_column_values_to_be_between
  column: TOTAL_ORDERS
  min_value: 0
  max_value: null
  meta:
    dimension: validity
    name: total_orders_non_negative
    description: Total orders must be non-negative
- expectation: expect_column_values_to_be_between
  column: TOTAL_REVENUE
  min_value: 0
  max_value: null
  meta:
    dimension: validity
    name: total_revenue_non_negative
    description: Total revenue must be non-negative
- expectation: expect_column_values_to_be_between
  column: TOTAL_ORDERS
  min_value: 0
  max_value: null
  meta:
    dimension: validity
    name: total_orders_non_negative_valid_range
    description: Total orders must be non-negative
- expectation: expect_column_values_to_be_between
  column: TOTAL_REVENUE
  min_value: 0
  max_value: null
  meta:
    dimension: validity
    name: total_revenue_non_negative_valid_range
    description: Total revenue must be non-negative
- expectation: expect_column_values_to_not_be_null
  column: CUSTOMER_ID
  meta:
    name: no_missing_customer_ids
    dimension: completeness
    description: Customer profile grain must be populated
- expectation: expect_column_values_to_not_be_null
  column: EMAIL
  meta:
    name: no_missing_emails
    dimension: completeness
    description: Email is required on customer profile
- expectation: expect_column_values_to_be_unique
  column: CUSTOMER_ID
  meta:
    name: unique_customer_ids
    dimension: uniqueness
    description: One profile row per customer
profiles:
- CUSTOMER_ID
- REGION_NAME
- CUSTOMER_SEGMENT
- TOTAL_ORDERS
- TOTAL_REVENUE
