kind: dq
name: products_dq
depends_on: bronzev1.products
expectations:
- expectation: expect_table_row_count_to_be_between
  min_value: 1
  max_value: null
  meta:
    dimension: completeness
    name: catalog_has_products
- expectation: expect_column_values_to_be_in_set
  column: CATEGORY
  value_set:
  - Widgets
  - Gadgets
  - Doohickeys
  - Thingamajigs
  meta:
    dimension: validity
    name: valid_category_values
    description: Checklist — invalid_percent with valid values
- expectation: expect_column_values_to_be_between
  column: PRICE
  min_value: 0
  max_value: 100000
  meta:
    dimension: validity
    name: price_in_valid_range
    description: Checklist — valid min and valid max
- expectation: expect_column_values_to_match_regex
  column: CATEGORY
  regex: ^[A-Za-z]+$
  meta:
    dimension: validity
    name: category_valid_regex
    description: Checklist — valid regex on category token
- expectation: unexpected_rows_expectation
  unexpected_rows_query: 'SELECT CATEGORY, COUNT(*) AS cnt

    FROM bronzev1.products

    GROUP BY CATEGORY

    HAVING COUNT(*) = 0'
  meta:
    dimension: conformity
    name: category_distribution_mix
    description: Checklist — distribution-style mix (each CATEGORY must appear)
- expectation: unexpected_rows_expectation
  unexpected_rows_query: 'SELECT CATEGORY

    FROM bronzev1.products

    WHERE CATEGORY NOT IN (''Widgets'', ''Gadgets'', ''Doohickeys'', ''Thingamajigs'')'
  meta:
    dimension: conformity
    name: category_distribution_difference_proxy
    description: Checklist — distribution_difference proxy vs allowed set
- expectation: unexpected_rows_expectation
  unexpected_rows_query: "SELECT column_name\nFROM information_schema.columns\nWHERE table_schema = 'bronzev1' AND table_name\
    \ = 'products'\n  AND column_name = '__unexpected_column__'"
  meta:
    dimension: conformity
    name: schema_evolution_stand_in
    description: Checklist — schema evolution stand-in (no unexpected column)
- expectation: expect_table_row_count_to_be_between
  min_value: 1
  max_value: 1000000
  meta:
    dimension: completeness
    name: intentional_fail_catalog_size
    description: Checklist — catalog size within seed bounds (pass)
- expectation: expect_column_values_to_be_in_set
  column: CATEGORY
  value_set:
  - Widgets
  - Gadgets
  - Doohickeys
  - Thingamajigs
  meta:
    dimension: validity
    name: valid_category_values_valid_values
    description: Checklist — invalid_percent with valid values
- expectation: expect_column_values_to_be_between
  column: PRICE
  min_value: 0
  max_value: 100000
  meta:
    dimension: validity
    name: price_in_valid_range_valid_range
    description: Checklist — valid min and valid max
- expectation: expect_column_values_to_match_regex
  column: CATEGORY
  regex: ^[A-Za-z]+$
  meta:
    dimension: validity
    name: category_valid_regex_valid_regex
    description: Checklist — valid regex on category token
- expectation: expect_column_values_to_not_be_null
  column: PRODUCT_ID
  meta:
    name: no_missing_product_ids
    dimension: completeness
    description: Product grain must be populated
- expectation: expect_column_values_to_not_be_null
  column: SUPPLIER_ID
  meta:
    name: no_missing_supplier_ids
    dimension: completeness
    description: Every product references a supplier
- expectation: expect_column_values_to_not_be_null
  column: PRICE
  meta:
    name: no_missing_prices
    dimension: completeness
    description: List price is required
- expectation: expect_column_values_to_be_unique
  column: PRODUCT_ID
  meta:
    name: unique_product_ids
    dimension: uniqueness
    description: Product ID is the table grain
- expectation: unexpected_rows_expectation
  unexpected_rows_query: 'SELECT p.PRODUCT_ID, p.SUPPLIER_ID

    FROM {batch} AS p

    LEFT JOIN bronzev1.suppliers AS s ON p.SUPPLIER_ID = s.SUPPLIER_ID

    WHERE s.SUPPLIER_ID IS NULL

    '
  meta:
    name: products_have_valid_suppliers
    dimension: consistency
    description: Every product must reference an existing supplier
profiles:
- CATEGORY
- PRICE
- NAME
