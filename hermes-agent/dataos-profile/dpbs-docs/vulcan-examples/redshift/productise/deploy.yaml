version: v1alpha
type: vulcan
name: ri-redshift
tags:
  - retail
  - retail-intelligence
  - order-analytics
  - sales-operations
  - redshift
spec:
  compute: engineering-compute
  engine: redshift
  repo:
    url: https://bitbucket.org/rubik_/vulcan-examples
    syncFlags:
      - "--ref=main"
      - "--submodules=off"
    baseDir: vulcan-examples/redshift/productise
    secretId: engineering:gitsecretan
  depots:
    - dataos://redshiftdepot1?purpose=rw
  workflow:
    schedule:
      crons:
        - "0 */3 * * *"
      endOn: "2027-01-01T00:00:00-00:00"
      timezone: "US/Pacific"
      concurrencyPolicy: Forbid
    logLevel: INFO
    resource:
      request:
        cpu: "200m"
        memory: "512Mi"
      limit:
        cpu: "1000m"
        memory: "1Gi"
    plan:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - plan
        - --auto-apply
    run:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - run
  api:
    replicas: 2
    logLevel: INFO
    resource:
      request:
        cpu: "200m"
        memory: "512Mi"
      limit:
        cpu: "4000m"
        memory: "3Gi"
