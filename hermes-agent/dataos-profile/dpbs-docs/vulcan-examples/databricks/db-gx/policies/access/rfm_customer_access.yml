type: policy
name: rfm_customer_access
depends_on:
  - goldv1.rfm_customer_segmentation

rules:
  - group: product_sandbox_tenant_admin
  - group: retail_admin
  - group: retail_north_analyst
    mask:
      - email
      - customer_name
      - recommended_action

    filter:
      - member: region_name
        operator: equals
        values:
          - North
  - group: retail_south_analyst
    mask:
      - email
      - customer_name
      - recommended_action

    filter:
      - member: region_name
        operator: equals
        values:
          - South
  - group: retail_east_analyst
    mask:
      - email
      - customer_name
      - recommended_action

    filter:
      - member: region_name
        operator: equals
        values:
          - East
  - group: retail_west_analyst
    mask:
      - email
      - customer_name
      - recommended_action

    filter:
      - member: region_name
        operator: equals
        values:
          - West
  - group: retail_central_analyst
    mask:
      - email
      - customer_name
      - recommended_action

    filter:
      - member: region_name
        operator: equals
        values:
          - Central
