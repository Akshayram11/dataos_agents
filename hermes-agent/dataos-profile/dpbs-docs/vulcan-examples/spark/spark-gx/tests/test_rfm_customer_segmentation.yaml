test_rfm_customer_segmentation_hibernating_is_at_risk:
  model: s3lhdepotrr.gold_sparkv.rfm_customer_segmentation
  inputs:
    s3lhdepotrr.silver_sparkv.dim_customer_profile:
      - customer_id: 99
        customer_name: "Casey Lowe"
        email: "casey.lowe@example.com"
        signup_date: "2024-06-01"
        region_id: 2
        region_name: South
        first_order_date: "2024-07-01"
        last_order_date: "2025-11-01"
        days_since_first_order: 540
        days_since_last_order: 200
        total_orders: 1
        total_items_purchased: 3
        total_revenue: 50.00
        avg_order_value: 50.00
        favorite_category: Gadgets
        total_shipments_received: 1
        customer_segment: Low Value
  outputs:
    query:
      rows:
        - customer_id: 99
          recency_days: 200
          frequency_orders: 1
          monetary_value: 50.00
          recency_score: 1
          frequency_score: 2
          monetary_score: 2
          rfm_segment: Hibernating
          is_at_risk_customer: true
      partial: true

