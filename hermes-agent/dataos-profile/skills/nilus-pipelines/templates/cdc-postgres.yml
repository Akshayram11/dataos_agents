name: cdc-pg-table1
version: v1alpha
type: nilus
tags: [service, nilus-cdc]
spec:
  type: cdc
  compute: runnable
  logLevel: INFO
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  source:
    address: dataos://cdc12pgdepot?purpose=rw
    options:
      strategy: flatten
    cdc:
      table.include.list: "product_testing.table1"
      topic.prefix: "cdc12pg"
      slot.name: "cdc12pg"
      publication.name: "cdc_user_publication"
      publication.autocreate.mode: "disabled"
      heartbeat.interval.ms: 500
  sink:
    address: dataos://cdc12pgdepot?purpose=rw
    options:
      dest_table: nilus_cdc_sink
      incremental_strategy: append
